<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Langton's Loops</title>
<style>
html,
body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: black;
    width: 100%;
    height: 100%;
}

canvas {
    display: block;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const CELL_SIZE = 6;

let cellsX;
let cellsY;

let currentGrid;
let nextGrid;

const rulesText = `
000000 000012 000020 000030 000050 000063 000071 000112 000122 000132 000212
000220 000230 000262 000272 000320 000525 000622 000722 001022 001120 002020
002030 002050 002125 002220 002322 005222 012321 012421 012525 012621 012721
012751 014221 014321 014421 014721 016251 017221 017255 017521 017621 017721
025271 100011 100061 100077 100111 100121 100211 100244 100277 100511 101011
101111 101244 101277 102026 102121 102211 102244 102263 102277 102327 102424
102626 102644 102677 102710 102727 105427 111121 111221 111244 111251 111261
111277 111522 112121 112221 112244 112251 112277 112321 112424 112621 112727
113221 122244 122277 122434 122547 123244 123277 124255 124267 125275 200012
200022 200042 200071 200122 200152 200212 200222 200232 200242 200250 200262
200272 200326 200423 200517 200522 200575 200722 201022 201122 201222 201422
201722 202022 202032 202052 202073 202122 202152 202212 202222 202272 202321
202422 202452 202520 202552 202622 202722 203122 203216 203226 203422 204222
205122 205212 205222 205521 205725 206222 206722 207122 207222 207422 207722
211222 211261 212222 212242 212262 212272 214222 215222 216222 217222 222272
222442 222462 222762 222772 300013 300022 300041 300076 300123 300421 300622
301021 301220 302511 401120 401220 401250 402120 402221 402326 402520 403221
500022 500215 500225 500232 500272 500520 502022 502122 502152 502220 502244
502722 512122 512220 512422 512722 600011 600021 602120 612125 612131 612225
700077 701120 701220 701250 702120 702221 702251 702321 702525 702720
`;

const baseRules = rulesText.trim().split(/\s+/);

const rulesMap = new Map();

function addRule(rule) {
    rulesMap.set(rule.substring(0, 5), Number(rule[5]));
}

for (const r of baseRules) {

    addRule(r);

    const r1 =
        r[0] + r[2] + r[3] + r[4] + r[1] + r[5];

    const r2 =
        r[0] + r[3] + r[4] + r[1] + r[2] + r[5];

    const r3 =
        r[0] + r[4] + r[1] + r[2] + r[3] + r[5];

    addRule(r1);
    addRule(r2);
    addRule(r3);
}

const initialPattern = [
[0,2,2,2,2,2,2,2,2,0,0,0,0,0,0],
[2,1,7,0,1,4,0,1,4,2,0,0,0,0,0],
[2,0,2,2,2,2,2,2,0,2,0,0,0,0,0],
[2,7,2,0,0,0,0,2,1,2,0,0,0,0,0],
[2,1,2,0,0,0,0,2,1,2,0,0,0,0,0],
[2,0,2,0,0,0,0,2,1,2,0,0,0,0,0],
[2,7,2,0,0,0,0,2,1,2,0,0,0,0,0],
[2,1,2,2,2,2,2,2,1,2,2,2,2,2,0],
[2,0,7,1,0,7,1,0,7,1,1,1,1,1,2],
[0,2,2,2,2,2,2,2,2,2,2,2,2,2,0]
];

const colors = [
"#000000",
"#0000FF",
"#FF0000",
"#00FF00",
"#FFFF00",
"#FFC0CB",
"#FFFFFF",
"#00FFFF"
];

let initialized = false;

function resizeCanvas() {

    const oldGrid = currentGrid;
    const oldCellsX = cellsX;
    const oldCellsY = cellsY;

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    cellsX = Math.floor(canvas.width / CELL_SIZE);
    cellsY = Math.floor(canvas.height / CELL_SIZE);

    currentGrid = new Uint8Array(cellsX * cellsY);
    nextGrid = new Uint8Array(cellsX * cellsY);

    if (!initialized) {

        initializePattern();

        initialized = true;

        return;
    }

    // Copy old simulation into resized grid
    const copyWidth = Math.min(oldCellsX, cellsX);
    const copyHeight = Math.min(oldCellsY, cellsY);

    for (let y = 0; y < copyHeight; y++) {

        for (let x = 0; x < copyWidth; x++) {

            currentGrid[y * cellsX + x] =
                oldGrid[y * oldCellsX + x];
        }
    }
}

function initializePattern() {

    const startX =
        Math.floor(cellsX / 2);

    const startY =
        Math.floor(cellsY / 2);

    for (let y = 0; y < initialPattern.length; y++) {

        for (let x = 0; x < initialPattern[y].length; x++) {

            const gx = startX + x;
            const gy = startY + y;

            if (
                gx >= 0 &&
                gx < cellsX &&
                gy >= 0 &&
                gy < cellsY
            ) {
                currentGrid[
                    gy * cellsX + gx
                ] = initialPattern[y][x];
            }
        }
    }
}

function step() {

    for (let y = 1; y < cellsY - 1; y++) {

        for (let x = 1; x < cellsX - 1; x++) {

            const i = y * cellsX + x;

            const center = currentGrid[i];

            const top = currentGrid[i - cellsX];
            const right = currentGrid[i + 1];
            const bottom = currentGrid[i + cellsX];
            const left = currentGrid[i - 1];

            const key =
                `${center}${top}${right}${bottom}${left}`;

            nextGrid[i] =
                rulesMap.has(key)
                ? rulesMap.get(key)
                : center;
        }
    }

    [currentGrid, nextGrid] =
        [nextGrid, currentGrid];
}

function draw() {

    ctx.fillStyle = "black";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    for (let y = 0; y < cellsY; y++) {

        for (let x = 0; x < cellsX; x++) {

            const value =
                currentGrid[y * cellsX + x];

            ctx.fillStyle = colors[value];

            ctx.fillRect(
                x * CELL_SIZE,
                y * CELL_SIZE,
                CELL_SIZE,
                CELL_SIZE
            );
        }
    }
}

function animate() {

    step();

    draw();

    requestAnimationFrame(animate);
}

window.addEventListener("resize", resizeCanvas);

resizeCanvas();

animate();
</script>
</body>
</html>
